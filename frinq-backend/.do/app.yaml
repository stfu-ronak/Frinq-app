name: frinq-backend
region: blr

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: dhairya2003vashishtha/Frinq-app
      branch: main
      deploy_on_push: true
      source_dir: frinq-backend
    build_command: pip install -r requirements.txt
    # PYTHONPATH=. is required: `python scripts/predeploy.py` puts scripts/
    # itself (not the project root) at the front of sys.path, so `from
    # app...` fails with ModuleNotFoundError without it. Confirmed by
    # reproducing locally — this job would have failed on every real deploy.
    run_command: PYTHONPATH=. python scripts/predeploy.py
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        type: SECRET

services:
  - name: api
    github:
      repo: dhairya2003vashishtha/Frinq-app
      branch: main
      deploy_on_push: true
      source_dir: frinq-backend
    build_command: pip install -r requirements.txt
    # --proxy-headers: trusts X-Forwarded-For/-Proto from DO's own load
    # balancer (the only immediate upstream) so request.url.scheme correctly
    # reports "https"/"wss" and rate-limiting's IP extraction (app/api/v1/
    # otp.py's X-Forwarded-For read) sees the real client, not the LB.
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      # /health/ready (not just liveness) — a rolling deploy must not route
      # traffic to an instance that's up but can't reach its DB/Redis.
      http_path: /health/ready
    envs:
      - key: APP_ENV
        value: production
      # No DO bindable variable for this could be verified against live docs
      # in this environment (no internet/doc access, same limitation flagged
      # for frinq-frontend's static-site headers in Task 44) — set to a real
      # commit SHA or build tag by whatever deploys this (CI, or the owner
      # manually) rather than guessing an unverified platform variable name.
      # Defaults to "dev" in app/config.py if never set.
      - key: DEPLOYMENT_VERSION
        value: unset-verify-before-real-deploy
      # Emergency kill switch (docs/runbooks/incident-response.md) — flip to
      # "true" and redeploy to reject all new chat sends without touching
      # membership/history/reads. Declared here (not just config.py's
      # default) so an incident responder can find and flip it fast.
      - key: CHAT_DISABLED
        value: "false"
      # Task 47 Step 5's remaining failure switches — same convention.
      - key: OTP_REQUESTS_DISABLED
        value: "false"
      - key: QUIZ_STARTS_DISABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://app.frinq.in,https://admin.frinq.in,https://localhost,capacitor://localhost"
      - key: ADMIN_KEY
        type: SECRET
      - key: ADMIN_ACTION_PASSWORD
        type: SECRET
      - key: ADMIN_ACTOR_ID
        type: SECRET
      - key: DATABASE_URL
        type: SECRET
      - key: SUPABASE_URL
        type: SECRET
      - key: SUPABASE_SERVICE_KEY
        type: SECRET
      - key: SUPABASE_JWT_SECRET
        type: SECRET
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: OPENAI_API_KEY
        type: SECRET
      - key: REDIS_URL
        type: SECRET
      - key: VOYAGE_API_KEY
        type: SECRET
      - key: SECRET_KEY
        type: SECRET
      - key: SESSION_HASH_PEPPER
        type: SECRET
      - key: RATE_LIMIT_PEPPER
        type: SECRET
      - key: PUSH_TOKEN_HASH_PEPPER
        type: SECRET
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        type: SECRET
      - key: FCM_SERVICE_ACCOUNT_JSON
        type: SECRET
      - key: LINKEDIN_CLIENT_ID
        type: SECRET
      - key: LINKEDIN_CLIENT_SECRET
        type: SECRET
      - key: LINKEDIN_REDIRECT_URI
        type: SECRET
      - key: DEV_PHONE
        type: SECRET
      - key: DUMMY_OTP
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: TWILIO_VERIFY_SERVICE_SID
        type: SECRET
      - key: OTP_CHANNEL
        value: whatsapp
      - key: TWILIO_WHATSAPP_FROM
        type: SECRET
      - key: TWILIO_WHATSAPP_TEMPLATE_SID
        type: SECRET
      - key: TWILIO_WHATSAPP_FOLLOWUP_TEMPLATE_SID
        type: SECRET

workers:
  - name: worker
    github:
      repo: dhairya2003vashishtha/Frinq-app
      branch: main
      deploy_on_push: true
      source_dir: frinq-backend
    build_command: pip install -r requirements.txt
    run_command: arq app.workers.queue.WorkerSettings
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        type: SECRET
      - key: REDIS_URL
        type: SECRET
      - key: OPENAI_API_KEY
        type: SECRET
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: VOYAGE_API_KEY
        type: SECRET
      - key: INSIGHTS_PROVIDER
        value: openai
      # send_community_push (app/workers/tasks/push.py) runs in this worker
      # process, not the API service — it needs its own copy of these.
      - key: PUSH_TOKEN_HASH_PEPPER
        type: SECRET
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        type: SECRET
      - key: FCM_SERVICE_ACCOUNT_JSON
        type: SECRET
      # Task 47 Step 5 failure switch -- send_community_push runs here, so
      # this flag must live in the worker's own envs too.
      - key: PUSH_SENDS_DISABLED
        value: "false"

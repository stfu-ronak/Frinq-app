name: frinq-frontend
region: blr

static_sites:
  - name: web
    github:
      repo: dhairya2003vashishtha/Frinq-app
      branch: main
      deploy_on_push: true
      source_dir: frinq-frontend
    build_command: npm ci && npm run build
    output_dir: out
    index_document: index.html
    error_document: 404.html
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: "https://frinq-backend-uqtbr.ondigitalocean.app"
      - key: NEXT_PUBLIC_DEV_PHONE
        type: SECRET
      - key: NEXT_PUBLIC_TEST_PHONES
        type: SECRET

domains:
  - domain: app.frinq.in
    type: PRIMARY
